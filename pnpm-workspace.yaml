allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true

# Security floors for transitive runtime packages. Remove an override once every
# parent dependency declares a patched compatible range of its own.
overrides:
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  dompurify: ^3.4.13
  "js-yaml@>=4.0.0 <5.0.0": 4.3.1
  "minimatch@>=10.0.0 <10.2.3": 10.2.3
  "path-to-regexp@>=4.0.0 <6.3.0": 6.3.0
  "path-to-regexp@>=8.0.0 <8.4.0": 8.4.0
  postcss: ^8.5.26
  sharp: ^0.35.3
  "tar@<=7.5.18": 7.5.19
  "undici@>=7.0.0 <7.29.0": ^7.29.0
